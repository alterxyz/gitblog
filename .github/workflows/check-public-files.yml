name: Check private paths

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: node scripts/check-public-files.mjs --ci-history
        env:
          BASE_REV: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REV: ${{ github.event.pull_request.head.sha || github.sha }}
